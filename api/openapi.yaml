  /v1/points/{point_id}/profile:
    put:
      tags: [温区配置]
      summary: 登记或更新一个点位的温区配置
      description: |
        改的是判定口径，所以要「更新点位温区配置」这一项权限（经办与主管持有），
        调阅岗只看不改，投递通道两者都不持有。

        三条规矩：
          - 写进去的是**整份**配置，不做局部合并——库里不留半新半旧的拼装结果；
          - 校验不过就**不落库**：库里那份配置原样留着，继续可用；
          - 路径里的 point_id 与请求体里的 point_id 必须一致，不一致直接拒绝。

        校验口径与判定时完全一致：zone_min_c 不得大于 zone_max_c、
        min_excursion_minutes 与 sample_interval_sec 必须为正数。
        「不猜、不顶替」——门槛留空意味着「不知道连续超限多久才算越温」，
        系统一旦替现场填个默认值，结论就成了系统的猜测。
      operationId: updatePointProfile
      parameters:
        - name: point_id
          in: path
          required: true
          description: 这份配置适用的点位。
          schema:
            type: string
          example: point-vax-freezer-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PointProfileInput"
            examples:
              vaccineFridge:
                summary: 疫苗冷藏库 2~8℃
                value:
                  point_id: point-vax-freezer-01
                  zone_min_c: 2
                  zone_max_c: 8
                  sample_interval_sec: 300
                  min_excursion_minutes: 20
                  hysteresis_c: 0.5
                  accuracy_limit_c: 0.5
                  products:
                    - product_name: 某疫苗制品
                      zone_min_c: 2
                      zone_max_c: 8
                      zone_ref: 疫苗储存和运输管理规范（2017 年版）
      responses:
        "200":
          description: 配置已登记生效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointProfileResponse"
              examples:
                updated:
                  summary: 登记生效
                  value:
                    point_id: point-vax-freezer-01
                    profile:
                      point_id: point-vax-freezer-01
                      zone_min_c: 2
                      zone_max_c: 8
                      sample_interval_sec: 300
                      min_excursion_minutes: 20
                      hysteresis_c: 0.5
                      accuracy_limit_c: 0.5
                      products:
                        - product_name: 某疫苗制品
                          zone_min_c: 2
                          zone_max_c: 8
                          zone_ref: 疫苗储存和运输管理规范（2017 年版）
                    updated_at: "2026-10-20T08:05:11+08:00"
                    note: 配置已登记生效；之后新建的判定按这份配置判，已判定的历史结论仍按当时的配置快照复算
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/RoleRequiredError"

  /v1/summary:
    get:
      tags: [运行摘要]
      summary: 运行摘要
      description: |
        回答运维站在服务前最常问的三句：现在有事吗、哪一步慢、还有多少条没进台账。

        窗口内发生的事（采样数、判定段数、失败段数、模型调用数与降级率）
        与此刻还欠着的事（待确认、待写回、挂着的告警）分开报：
        前者是「昨夜到现在」，后者是「现在还有几条没人管」。

        取数走索引范围扫描，逐小时分解走小时级聚合表——
        这个端点被轮询，扫全表会直接拖垮主路径。

        只读：不推进任何业务状态，也不发任何出站请求。
      operationId: getSummary
      responses:
        "200":
          description: 运行摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResponse"
              examples:
                busy:
                  summary: 昨夜越温一次，还有一条没进台账

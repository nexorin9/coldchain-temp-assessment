                        to_state: confirmed
                        details: 处置结论已固化，台账写回载荷就绪
                        created_at: "2026-10-20T04:10:22+08:00"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/RoleRequiredError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /v1/runs/{id}/confirm:
    post:
      tags: [人工确认]
      summary: 确认一条待确认的判定
      description: |
        整条链上唯一由人推进业务状态的入口，只有药学部主管身份能做。

        确认做两件事：把结论从「待确认」推到「已确认」并把台账要写的内容固化下来；
        确认成立之后触发那一段出站写回（写冷链台账、通知接种门诊）。

        处置结论取值固定四个：isolate（隔离）、pending_manufacturer_evaluation（待疫苗生产企业评估）、
        release（放行）、scrap（报损）。批次到底能不能用由疫苗生产企业评估质量影响、
        再由主管确认决定，系统不代为判断。
      operationId: confirmRun
      parameters:
        - $ref: "#/components/parameters/RunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRequest"
            examples:
              isolate:
                summary: 先隔离，等疫苗生产企业评估
                value:
                  actor: 药学部主管张
                  disposition: isolate
                  opinion: 夜间断电约 4 小时，峰值 12.4℃，先隔离整柜，等疫苗生产企业评估质量影响
      responses:
        "200":
          description: 确认成立，已固化台账写回载荷
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmResponse"
              examples:
                confirmed:
                  summary: 确认成立
                  value:
                    run_id: run_3f9c1a7d5b2e4c08
                    previous_state: awaiting_confirmation
                    state: confirmed
                    confirmed_by: 药学部主管张
                    confirmed_at: "2026-10-20T04:10:22+08:00"
                    disposition: isolate
                    disposition_label: 隔离
                    opinion: 夜间断电约 4 小时，峰值 12.4℃，先隔离整柜，等疫苗生产企业评估质量影响
                    external_ref: cc-point-vax-freezer-01-20261019T191000Z
                    idempotency_key: 54b35c7f136371619ea6a5313714d1ac3d4173e3f835bcc97eb1087e6f7dddae
                    writeback_state: pending
                    payload_frozen: true
                    note: 结论已确认并固化；台账写入与门诊通知是确认之后的另一段流程
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/RoleRequiredError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /v1/runs/{id}/reject:
    post:
      tags: [人工确认]
      summary: 否决一条判定
      description: |
        被否决的判定不写冷链台账：台账里多一条没发生过的越温，
        比少记一条更麻烦——前者会让越温统计对不上真实温控记录。

        否决时不需要处置结论：处置结论只在成立时才有意义。
      operationId: rejectRun
      parameters:
        - $ref: "#/components/parameters/RunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
            examples:
              rejected:
                summary: 判定为记录仪探头脱落，不成立
                value:
                  actor: 药学部主管张
                  opinion: 同期探头读数在同柜另一支记录仪上正常，判为探头脱落，越温不成立
      responses:
        "200":
          description: 否决成立
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmResponse"
              examples:
                rejected:
                  summary: 否决成立
                  value:
                    run_id: run_3f9c1a7d5b2e4c08
                    previous_state: awaiting_confirmation
                    state: rejected
                    confirmed_by: 药学部主管张
                    confirmed_at: "2026-10-20T04:12:40+08:00"
                    opinion: 同期探头读数在同柜另一支记录仪上正常，判为探头脱落，越温不成立
                    external_ref: cc-point-vax-freezer-01-20261019T191000Z
                    idempotency_key: 54b35c7f136371619ea6a5313714d1ac3d4173e3f835bcc97eb1087e6f7dddae
                    payload_frozen: false
                    note: 结论已否决；本次不写冷链台账、不通知接种门诊
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/RoleRequiredError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /v1/runs/{id}/writeback/retry:
    post:
      tags: [写回补偿]
      summary: 补偿重放一次台账写回
      description: |
        把一条没写进冷链台账的越温补上。

        它不是确认：载荷、幂等键与 external_ref 全是上次确认时定下的那份，
        重放不改内容——重放的人并没有对内容做任何新决定。
        所以经办（日常跑判定的人）拿得到它，而确认权仍然只在主管手上。
      operationId: retryWriteback
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: 补偿重放结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryWritebackResponse"
              examples:
                written:
                  summary: 台账与通知本次都写成了
                  value:
                    run_id: run_9a4d2e7c8b1f3d55
                    external_ref: cc-point-vax-freezer-01-20261021T140500Z
                    idempotency_key: 9f1c6b0d5e7a4c2388d0b1f6e3a2c5d7b8e40a19c2d3f6b5e8a1c4d7f0b3e6a9
                    ledger_written: true
                    ledger_skipped: false
                    notification_sent: true
                    notification_skipped: false
                    ledger_attempts: 1
                    notification_attempts: 1
                    writeback_state: written_back
                    compensation: true
                    note: 台账与通知两处本次都写成了
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/RoleRequiredError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /v1/writebacks/pending:
    get:
      tags: [写回补偿]
      summary: 待补偿写回清单
      description: |
        回答「哪些越温还没进台账」。出站写回退避重试耗尽后越温进这份清单，
        等人补发；它是「台账写不进去」这件事唯一可见的出口。
      operationId: listPendingWritebacks

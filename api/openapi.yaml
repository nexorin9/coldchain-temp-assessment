          example: 台账侧返回 503，退避重试 2 次后仍失败
        attempts:
          type: integer
          example: 3
        failures:
          type: integer
          example: 3
        first_failed_at:
          type: string
          format: date-time
          example: "2026-10-22T09:15:41+08:00"
        last_failed_at:
          type: string
          format: date-time
          example: "2026-10-22T09:15:44+08:00"
        resolved_at:
          type: string
          format: date-time
          description: 告警解掉的时刻；未解时缺省。
          example: "2026-10-22T10:02:11+08:00"
        created_at:
          type: string
          format: date-time
          example: "2026-10-22T09:15:41+08:00"
        updated_at:
          type: string
          format: date-time
          example: "2026-10-22T09:15:44+08:00"

    PendingWritebacksResponse:
      type: object
      description: 待补偿写回清单。
      properties:
        pending_count:
          type: integer
          example: 1
        open_alert_count:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/PendingWriteback"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/WritebackAlert"

    RetryWritebackResponse:
      type: object
      description: 补偿重放回执。
      properties:
        run_id:
          type: string
          example: run_9a4d2e7c8b1f3d55
        external_ref:
          type: string
          example: cc-point-vax-freezer-01-20261021T140500Z
        idempotency_key:
          type: string
          example: 9f1c6b0d5e7a4c2388d0b1f6e3a2c5d7b8e40a19c2d3f6b5e8a1c4d7f0b3e6a9
        ledger_written:
          type: boolean
          example: true
        ledger_skipped:
          type: boolean
          example: false
        ledger_error:
          type: string
          example: E_LEDGER_UNAVAILABLE
        ledger_error_detail:
          type: string
          example: 台账侧返回 503
        ledger_attempts:
          type: integer
          example: 1
        notification_sent:
          type: boolean
          example: true
        notification_skipped:
          type: boolean
          example: false
        notification_error:
          type: string
          example: E_NOTIFY_UNAVAILABLE
        notification_error_detail:
          type: string
          example: 通知系统返回 502
        notification_attempts:
          type: integer
          example: 1
        writeback_state:
          type: string
          example: written_back
        compensation:
          type: boolean
          description: 本次是否为补偿重放。
          example: true
        note:
          type: string
          example: 台账与通知两处本次都写成了

    ProductProfile:
      type: object
      description: 一个制品的温区条目。
      properties:
        product_name:
          type: string
          example: 某疫苗制品
        zone_min_c:
          type: number
          example: 2
        zone_max_c:
          type: number
          example: 8
        zone_ref:
          type: string
          description: 温区出处（可查的文件或条款）。
          example: 疫苗储存和运输管理规范（2017 年版）

    DeviceBinding:
      type: object
      description: 点位登记的设备。
      properties:
        device_id:
          type: string
          example: device-recorder-0001
        device_name:
          type: string
          example: 疫苗冷藏库温度记录仪

    PointProfileInput:
      type: object
      description: |
        点位温区配置。写进去的是整份配置，不做局部合并。

        判定门槛三项必须显式填：sample_interval_sec（采样周期，秒）、
        min_excursion_minutes（成立越温窗口的最短持续分钟数）、
        hysteresis_c（迟滞带，℃）。留空等于「不知道」，系统不替现场填默认值。
      required: [zone_min_c, zone_max_c, sample_interval_sec, min_excursion_minutes]
      properties:
        point_id:
          type: string
          description: 配置适用的点位；不填时取路径里的 point_id。
          example: point-vax-freezer-01
        zone_min_c:
          type: number
          description: 温区下限（℃）。不得大于 zone_max_c。
          example: 2
        zone_max_c:
          type: number
          description: 温区上限（℃）。不得超出记录仪量程 [-80, 120]。
          example: 8
        sample_interval_sec:
          type: integer
          description: 标称采样周期（秒）。必须为正数。
          example: 300
        min_excursion_minutes:
          type: integer
          description: 成立正式越温窗口的最短持续时长（分钟）。必须为正数。
          example: 20
        hysteresis_c:
          type: number
          description: 迟滞带（℃）：越限后要回落到 (zone_max_c - hysteresis_c) 以内才算回到温区。
          example: 0.5
        accuracy_limit_c:
          type: number
          description: 精度上限（℃）；不填时按设备类规范口径取。
          example: 0.5
        products:
          type: array
          description: 该点位上的逐制品温区条目。
          items:
            $ref: "#/components/schemas/ProductProfile"
        devices:
          type: array
          description: 该点位登记的设备清单；为空表示未登记（不表示有歧义）。
          items:
            $ref: "#/components/schemas/DeviceBinding"

    PointProfileListResponse:
      type: object
      description: 点位温区配置清单。
      properties:
        count:
          type: integer
          example: 2
        profiles:
          type: array
          description: 各点位的温区配置，按 point_id 升序。
          items:
            $ref: "#/components/schemas/PointProfileInput"
        note:
          type: string
          example: 清单按 point_id 升序；已判定的历史结论仍按判定当时的配置快照复算，不受这里的更新影响

    HourlyBucket:
      type: object
      description: |
        一个小时桶的统计（跨点位合并）。

        事件数按采样落库时刻归桶，越温次数按越限窗口起点归桶——
        跨小时的同一段越温只算在它开始的那一小时，各小时加起来正好等于实际段数。
      required: [hour_start, event_count, excursion_count, peak_temperature_c, points]
      properties:
        hour_start:
          type: string
          description: 这个桶的起点（UTC，RFC3339）。
          example: "2026-10-22T09:00:00Z"
        event_count:
          type: integer
          description: 这一小时入库的采样条数。
          example: 120
        excursion_count:
          type: integer
          description: 这一小时开始的越温段数。
          example: 1
        peak_temperature_c:
          type: number
          description: 这一小时的最高温度（℃）。
          example: 12.4
        points:
          type: integer
          description: 这一小时有采样的点位数。
          example: 3

    SummaryResponse:
      type: object
      description: |
        运行摘要。窗口内发生的事与此刻还欠着的事分开报；
        统计窗口、覆盖情况与提醒都随响应给出，免得看的人对着一个数字猜口径。
      required:
        - generated_at
        - window_hours
        - window_start
        - window_end
        - events
        - runs
        - failed_runs
        - degraded_runs
        - awaiting_confirmation
        - pending_writebacks
        - open_writeback_alerts
        - model_calls
        - degraded_model_calls
        - failed_model_calls
        - degrade_rate
        - running_runs
        - queued_runs
        - retrying_runs
        - hourly
        - hourly_covered_hours
      properties:
        generated_at:
          type: string
          description: 这份摘要的生成时刻（UTC，RFC3339）。
          example: "2026-10-22T12:00:00Z"
        window_hours:
          type: integer
          description: 统计窗口长度（小时）。
          example: 24
        window_start:
          type: string
          description: 统计区间起点（UTC，RFC3339）。
          example: "2026-10-21T12:00:00Z"
        window_end:
          type: string
          description: 统计区间终点（UTC，RFC3339）。
          example: "2026-10-22T12:00:00Z"
        events:
          type: integer
          description: 窗口内入库的温度采样条数。
          example: 1204
        runs:
          type: integer
          description: 窗口内新建的判定段数。
          example: 3
        failed_runs:
          type: integer
          description: 窗口内最终失败的判定段数（步骤重试已耗尽）。
          example: 1
        degraded_runs:
          type: integer
          description: 窗口内新建且结论降级的判定段数（归因退回了规则基线）。
          example: 1
        awaiting_confirmation:
          type: integer
          description: 此刻停在「待药学部主管确认」的判定数（当前存量，不按窗口化）。
          example: 1
        pending_writebacks:
          type: integer
          description: 此刻还没写进冷链台账的写回记录数。
          example: 1
        open_writeback_alerts:
          type: integer
          description: 此刻还挂着的写回告警数。
          example: 1
        model_calls:
          type: integer
          description: 窗口内的模型调用总次数。
          example: 5
        degraded_model_calls:
          type: integer
          description: 其中走了降级路径的次数。
          example: 2
        failed_model_calls:
          type: integer
          description: 其中失败的次数。
          example: 1
        degrade_rate:
          type: number
          description: 降级率 = 降级次数 / 模型调用总次数（0~1，保留四位小数）。
          example: 0.4
        running_runs:
          type: integer
          description: 此刻正在跑步骤链的判定数。
          example: 0
        queued_runs:
          type: integer
          description: 此刻排队等待的判定数。
          example: 0
        retrying_runs:
          type: integer
          description: 此刻正退避重试的判定数。
          example: 0
        hourly:
          type: array
          description: 逐小时分解（跨点位合并），按小时起点升序。
          items:
            $ref: "#/components/schemas/HourlyBucket"
        hourly_covered_hours:
          type: integer
          description: 逐小时分解实际覆盖了几个小时；小于 window_hours 时分解可能缺桶。
          example: 1
        notes:
          type: array
          description: 给看摘要的人留的话：口径提醒、覆盖缺口、降级提示。一切正常时为空。
          items:
            type: string
          example:
            - 有越温还没进冷链台账：先看 GET /v1/writebacks/pending 的待补偿清单

    PointProfileResponse:
      type: object
      description: 点位温区配置登记回执。
      properties:
        point_id:
          type: string
          example: point-vax-freezer-01
        profile:
          $ref: "#/components/schemas/PointProfileInput"
        updated_at:
          type: string
          format: date-time
          example: "2026-10-20T08:05:11+08:00"
        note:
          type: string
          example: 配置已登记生效；之后新建的判定按这份配置判，已判定的历史结论仍按当时的配置快照复算

  responses:
    UnauthorizedError:
      description: 缺少凭据或凭据不正确。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missingToken:
              summary: 没带 Authorization 头
              value:
                error_code: E_UNAUTHORIZED
                message: 缺少凭据或凭据不正确
                details: 缺少或无效的入站凭据
            wrongToken:
              summary: 令牌不对
              value:
                error_code: E_UNAUTHORIZED
                message: 缺少凭据或凭据不正确
                details: 缺少或无效的入站凭据

    RoleRequiredError:
      description: 身份成立但没有这项权限。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            auditorCannotConfirm:
              summary: 调阅岗不能确认处置结论
              value:
                error_code: E_ROLE_REQUIRED
                message: 当前身份无权执行该操作
                details: 当前身份「质控 / 院感（调阅）」无权执行「确认或否决处置结论」：该操作需要「确认或否决处置结论」权限，持该权限的身份为 药学部主管（审核）

    ValidationError:
      description: 请求不合法：字段缺失、格式错或取值非法。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missingField:
              summary: 缺必填字段
              value:
                error_code: E_VALIDATION
                message: 字段缺失或取值不合法
                details: 缺少 point_id
            badZone:
              summary: 温区上下限颠倒
              value:
                error_code: E_VALIDATION
                message: 字段缺失或取值不合法
                details: 点位 point-vax-freezer-01 的温区上下限非法：zone_min_c=8.00，zone_max_c=2.00
            badThreshold:
              summary: 判定门槛没填
              value:
                error_code: E_VALIDATION
                message: 字段缺失或取值不合法
                details: 点位 point-vax-freezer-01 的 min_excursion_minutes 必须为正数（当前 0）：连续超限多久才算越温必须显式填写，系统不替现场填默认值

    RangeError:
      description: 数值超出允许量程。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            temperatureOutOfRange:
              summary: 温度越量程
              value:
                error_code: E_RANGE
                message: 数值超出允许量程
                details: 数值超出允许量程（temperature_c=150.00 超出量程 [-80, 120]）

    RateLimitedError:
      description: 同一点位投递超过限速阈值，请求被显式拒绝（未入库）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            tooManyDeliveries:
              summary: 超过同点限流
              value:
                error_code: E_RATE_LIMITED
                message: 同一点位投递超出限流上限
                details: 点位 point-vax-freezer-01 的投递速率超过阈值，请求被拒绝（未入库）

    NotFoundError:
      description: 对象不存在。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            runNotFound:
              summary: 判定 run 不存在
              value:
                error_code: E_NOT_FOUND
                message: 对象不存在
                details: 判定 run 不存在：run_00000000

    ConflictError:
      description: 状态冲突：动作与当前状态不相容（如重复确认、越权状态迁移）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            alreadyConfirmed:
              summary: 这条判定已经确认过
              value:
                error_code: E_ILLEGAL_TRANSITION
                message: 业务状态不允许该迁移
                details: 状态迁移被拒绝：confirmed → confirmed（业务状态迁移表里没有这条边）

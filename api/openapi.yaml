  /v1/runs/{id}/audit:
    get:
      tags: [判定台账]
      summary: 一条判定的审计链
      description: |
        回答「这条判定当时用了模型吗、花了多少、谁确认的」。

        审计链记录模型调用的元数据（模型名、耗时、token、估算成本）与人工确认动作。
        登记的凭据原文在写入前就被抹掉：审计记录里不留 api_key、鉴权头与提示词原文。
      operationId: getRunAudit
      parameters:
        - $ref: "#/components/parameters/RunID"

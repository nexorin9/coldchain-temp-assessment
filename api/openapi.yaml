components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer 令牌。凭据只从环境变量读，进程内不落盘、不写日志。

        令牌命中哪一把凭据，就是哪个身份：记录仪 / 边缘网关（只投递）、
        药学部冷链管理员（经办）、药学部主管（审核）、质控 / 院感（调阅）。
        凭据只管进门，权限才管做事——越权一律 403 与 E_ROLE_REQUIRED。

  parameters:
    RunID:
      name: id
      in: path
      required: true
      description: 判定 run 的标识。
      schema:
        type: string
      example: run_3f9c1a7d5b2e4c08

  schemas:
    Error:
      type: object
      description: 统一错误响应体。调用方按 error_code 区分处理方式，不必解析中文文案。
      properties:
        error_code:
          type: string
          description: 机器可读的错误码。
          example: E_VALIDATION
        message:
          type: string
          description: 给人看的一句话说明。
          example: 缺少 point_id
        details:
          type: string
          description: 补充细节（可缺省）。
          example: 请求体里的 point_id 为空

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: coldchain-temp-assessment
        version:
          type: string
          example: 0.1.0

    VersionResponse:
      type: object
      properties:
        name:
          type: string
          example: coldchain-temp-assessment
        version:
          type: string
          example: 0.1.0

    TemperatureEventInput:
      type: object
      description: 记录仪上报的一条温度事件（原始上报，未规范化）。
      required: [point_id, measured_at, temperature_c]
      properties:
        point_id:
          type: string
          description: 温控点标识。
          example: point-vax-freezer-01
        device_id:
          type: string
          description: 记录仪标识。
          example: device-recorder-0001
        device_name:
          type: string
          description: 设备登记名。
          example: 疫苗冷藏库温度记录仪
        measured_at:
          type: string
          format: date-time
          description: 测量时刻。必须带时区偏移（如 +08:00），只给本地时刻的写法一律拒绝。
          example: "2026-10-20T03:15:00+08:00"
        temperature_c:
          type: number
          description: 温度值（℃）。量程 [-80, 120]，越限拒绝。
          example: 11.4
        unit:
          type: string
          description: 温度单位。F 按 (F-32)*5/9 换算，同时保留原始值与原始单位。
          enum: [C, F]
          example: C
        humidity_pct:
          type: number
          description: 相对湿度（%）。量程 [0, 100]。
          example: 62.5
        battery_pct:
          type: number
          description: 电量（%）。量程 [0, 100]。
          example: 91
        accuracy_c:
          type: number
          description: 设备自报的测温精度（℃）。超出该类设备规范上限时打「精度不足，仅供参考」标记。
          example: 0.3
        source:
          type: string
          description: 数据来源。
          enum: [recorder, edge-gateway, manual-upload]
          example: recorder
        alarm_flag:
          type: boolean
          description: 设备是否自带告警位。
          example: true
        events:
          type: array
          description: 设备事件。未知类型显式拒绝，不静默丢弃。
          items:
            type: string
            enum: [door_open, power_loss, defrost]
          example: [door_open]

    PrecisionNote:
      type: object
      description: 精度联动结论：设备自报精度超出规范上限时，结论仅供参考。
      properties:
        limited:
          type: boolean
          example: false
        limit_c:
          type: number
          description: 本次判定采用的精度上限（℃）。
          example: 0.5
        declared_c:
          type: number
          description: 设备自报的测温精度（℃）；未声明时这一项不出现，不冒充 0。
          example: 0.3
        tag:
          type: string
          description: 精度不足时的固定标注文案。

  /v1/points:
    get:
      tags: [温区配置]
      summary: 已登记的点位温区配置清单
      description: |
        回答「这台冷柜现在按什么温区判」：判定结论里的 2~8℃ 从哪来，
        复核的人第一句要问的就是这个。

        清单按 point_id 升序。已判定的历史结论仍按判定当时的配置快照复算，

openapi: 3.1.0

info:
  title: 药品与疫苗冷链温控判定服务
  version: 0.1.0
  description: |
    疫苗冷库与药学部冷藏药品冰箱的温湿度记录仪按 5 分钟粒度把温度事件推进来，
    本服务按点位温区抽出越温窗口、给出归因与《疫苗储存和运输温度异常情况记录表》草稿，
    交药学部主管确认后再写回冷链台账并通知接种门诊。

    三条使用约定：

      1. **批次能不能用不归本服务决定。** 处置结论只到「待确认」为止；
         批次可用性由疫苗生产企业评估质量影响、再由药学部主管确认决定。
      2. **配置缺失即不判。** 点位温区配置缺了或不可信，系统转人工并说明原因，
         不猜温区、不用默认值顶替。
      3. **未确认不得写回。** 模型产出只到草稿；只有主管身份的确认动作推进状态并触发出站写回。

    本文档是接口契约：每个端点都带请求 / 响应样例，
    样例缺失或只是占位符（TODO、待补、（填写））的端点一律判契约失败。
    文档由 scripts/check_openapi.sh 与 internal/contract 的契约测试守着，
    代码里加了端点却没进本文档（或反之），都会在验收时暴露出来。
  license:
    name: MIT

servers:
  - url: /
    description: 与本服务同源（院内内网小主机上的监听地址，由 serve --addr 指定）

tags:
  - name: 健康与版本
    description: 免鉴权，只回服务自身状态，不碰业务数据
  - name: 温度接入
    description: 记录仪 / 院内边缘网关投递温度事件与批量导入记录仪导出
  - name: 判定台账
    description: 查判定结论、越温窗口、步骤时间线与审计链
  - name: 温区配置
    description: 点位温区配置的登记与维护（判定口径的唯一来源）
  - name: 人工确认
    description: 主管确认与否决处置结论，触发出站写回
  - name: 写回补偿
    description: 出站写回没落成时的待补偿清单与补偿重放
  - name: 运行摘要
    description: 服务自己在跑的这 24 小时里发生了什么（只读看板）

paths:
  /healthz:
    get:
      tags: [健康与版本]
      summary: 服务存活状态
      description: 免鉴权。只回服务名、状态与版本，不回任何凭据或内网地址。
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: 服务存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                default:
                  summary: 服务存活
                  value:
                    status: ok
                    service: coldchain-temp-assessment
                    version: 0.1.0

  /v1/version:
    get:
      tags: [健康与版本]
      summary: 服务名称与版本
      description: 免鉴权。给院内小主机上的部署脚本与巡检脚本核对版本用。
      operationId: getVersion
      security: []
      responses:
        "200":
          description: 版本信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
              examples:
                default:
                  summary: 版本信息
                  value:
                    name: coldchain-temp-assessment
                    version: 0.1.0

  /v1/events/coldchain-temperature:
    post:
      tags: [温度接入]
      summary: 投递一条温度事件
      description: |
        记录仪或院内边缘网关在越温发生的那一刻推一条温度事件进来。

        幂等：同一点位的同一次采样重复投递只入库一行，
        第二次起返回 duplicate=true 且 event_id 与首次相同——记录仪重发、网关重试、
        院内网络抖动都不会在时序里留下重复点。
      operationId: ingestTemperatureEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemperatureEventInput"
            examples:
              doorOpenExcursion:
                summary: 开门导致的越温读数
                value:
                  point_id: point-vax-freezer-01
                  device_id: device-recorder-0001
                  device_name: 疫苗冷藏库温度记录仪
                  measured_at: "2026-10-20T03:15:00+08:00"
                  temperature_c: 11.4
                  unit: C
                  humidity_pct: 62.5
                  battery_pct: 91
                  accuracy_c: 0.3
                  source: recorder
                  alarm_flag: true
                  events: [door_open]
      responses:
        "202":
          description: 事件已入库
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAccepted"
              examples:
                accepted:
                  summary: 首次投递
                  value:
                    event_id: evt_87b2e6ed0a27607907a3b7215aca92b0
                    duplicate: false
                    point_id: point-vax-freezer-01
                    measured_at: "2026-10-20T03:15:00+08:00"
                    accepted_at: "2026-10-20T03:15:01+08:00"
                    run_state: pending
                    note: 事件已入库；判定 run 由调度器按点位与窗口建立，同一越温窗口只判一次
                    precision:
                      limited: false
                      limit_c: 0.5
                duplicate:
                  summary: 同一采样重复投递
                  value:
                    event_id: evt_87b2e6ed0a27607907a3b7215aca92b0
                    duplicate: true
                    point_id: point-vax-freezer-01
                    measured_at: "2026-10-20T03:15:00+08:00"
                    accepted_at: "2026-10-20T03:18:42+08:00"
                    run_state: pending
                    note: 该采样此前已入库，返回既有事件 ID，未重复落库
                    precision:
                      limited: false
                      limit_c: 0.5
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/RoleRequiredError"
        "422":
          $ref: "#/components/responses/RangeError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /v1/imports/temperature-series:
    post:
      tags: [温度接入]
      summary: 批量导入记录仪导出的温度序列
      description: |
        现场记录仪导出的 CSV 是真实入场材料。这个端点按表头驱动读取（不写死列序），
        每批单事务提交，返回导入行数、跳过行数与逐条跳过原因——脏行不静默丢弃。

        dry_run=true 时只校验不落库：跳过统计与实跑一致（除落库外无行为差异），
        拿它先跑一遍最省事。
      operationId: importTemperatureSeries
      parameters:
        - name: dry_run
          in: query
          required: false
          description: 只校验不落库。取值只认 true / false。
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
            examples:
              recorderExport:
                summary: 记录仪导出片段
                value: |
                  point_id,device_id,device_name,measured_at,temperature_c,unit,humidity_pct,battery_pct,accuracy_c,source,alarm_flag,events
                  point-vax-freezer-01,device-recorder-0001,疫苗冷藏库温度记录仪,2026-10-20T03:10:00+08:00,9.6,C,61.0,90,0.3,recorder,false,
                  point-vax-freezer-01,device-recorder-0001,疫苗冷藏库温度记录仪,2026-10-20T03:15:00+08:00,11.4,C,62.5,90,0.3,recorder,true,door_open
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: 导入完成（或干跑完成）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
              examples:
                imported:
                  summary: 干净文件整批入库
                  value:
                    imported: 84
                    skipped: 0
                    total_rows: 84
                    duplicates: 0
                    dry_run: false
                    skip_reasons: []
                    encoding: utf-8
                    encoding_fallback: false
                    original_bytes: 12038
                    extra_values: 0
                    note: 导入完成：合法行已单事务入库；跳过的行见 skip_reasons
                dirtyRows:
                  summary: 含脏行时逐条给出跳过原因
                  value:
                    imported: 81
                    skipped: 3
                    total_rows: 84
                    duplicates: 0
                    dry_run: false
                    skip_reasons:
                      - row: 3
                        code: unparsable_measured_at
                        reason: 测量时间不是带时区偏移的 RFC3339 时刻
                        point_id: point-vax-freezer-01
                      - row: 4
                        code: temperature_out_of_range
                        reason: 温度 150.00℃ 超出量程 [-80, 120]
                        point_id: point-vax-freezer-01
                      - row: 5
                        code: unknown_event_kind
                        reason: 未知设备事件类型：compressor_alarm
                        point_id: point-vax-freezer-01
                    encoding: utf-8
                    encoding_fallback: false
                    original_bytes: 12038
                    extra_values: 0
                    note: 导入完成：合法行已单事务入库；跳过的行见 skip_reasons
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/RoleRequiredError"

  /v1/runs:
    get:
      tags: [判定台账]
      summary: 判定台账清单
      description: |
        查「一段时间内判过哪些越温」。三个查询参数都是可选的：
        point_id 限点位，from / to 限窗口起点区间（闭区间）。

        from / to 只接受 RFC3339 带偏移的时刻：日期被悄悄解释成某个时区的零点，
        得到的清单就会少算或多算一整段越温，而清单看起来「正常」，没人会去核。
      operationId: listRuns
      parameters:
        - name: point_id
          in: query
          required: false
          description: 限点位；不传表示不限点位。
          schema:
            type: string
          example: point-vax-freezer-01
        - name: from
          in: query
          required: false
          description: 区间起点（RFC3339，带时区偏移）。按窗口起点取。
          schema:
            type: string
            format: date-time
          example: "2026-10-19T00:00:00+08:00"
        - name: to
          in: query
          required: false
          description: 区间终点（RFC3339，带时区偏移）。按窗口起点取。
          schema:
            type: string
            format: date-time
          example: "2026-10-26T00:00:00+08:00"
      responses:
        "200":
          description: 判定清单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunListResponse"
              examples:
                withRuns:
                  summary: 查到两条判定
                  value:
                    count: 2
                    point_id: point-vax-freezer-01
                    from: "2026-10-19T00:00:00+08:00"
                    to: "2026-10-26T00:00:00+08:00"
                    runs:
                      - run_id: run_3f9c1a7d5b2e4c08
                        point_id: point-vax-freezer-01
                        state: awaiting_confirmation
                        exec_state: succeeded
                        window_start: "2026-10-20T03:10:00+08:00"
                        window_end: "2026-10-20T03:25:00+08:00"
                        external_ref: cc-point-vax-freezer-01-20261019T191000Z
                        idempotency_key: 54b35c7f136371619ea6a5313714d1ac3d4173e3f835bcc97eb1087e6f7dddae
                        writeback_state: pending
                        created_at: "2026-10-20T03:26:10+08:00"
                        updated_at: "2026-10-20T03:26:12+08:00"
                        zone: 2~8℃
                        profile_present: true
                        degraded: false
                      - run_id: run_9a4d2e7c8b1f3d55
                        point_id: point-vax-freezer-01
                        state: confirmed
                        exec_state: succeeded
                        window_start: "2026-10-21T22:05:00+08:00"
                        window_end: "2026-10-21T22:50:00+08:00"
                        external_ref: cc-point-vax-freezer-01-20261021T140500Z
                        idempotency_key: 9f1c6b0d5e7a4c2388d0b1f6e3a2c5d7b8e40a19c2d3f6b5e8a1c4d7f0b3e6a9
                        writeback_state: written_back
                        written_back_at: "2026-10-22T09:12:03+08:00"
                        created_at: "2026-10-21T22:51:02+08:00"
                        updated_at: "2026-10-22T09:12:03+08:00"
                        zone: 2~8℃
                        profile_present: true
                        degraded: false
                empty:
                  summary: 区间内没有判定
                  value:
                    count: 0
                    point_id: point-vax-freezer-01
                    from: "2026-10-19T00:00:00+08:00"
                    to: "2026-10-26T00:00:00+08:00"
                    runs: []
                    note: 清单按窗口起点升序；窗口起点落在查询区间内的判定才会列出（未设窗口的采样不计入）
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/RoleRequiredError"

  /v1/runs/{id}:
    get:
      tags: [判定台账]
      summary: 一条判定的总体状态、窗口摘要与步骤产物

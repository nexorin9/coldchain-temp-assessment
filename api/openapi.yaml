        回答「那次越温判了没有、判到哪一步、谁确认的」。

        回四段：run（判定总体状态）、window（越温窗口摘要）、
        steps（步骤时间线）、products（按分码取回的结论产物）。
        找不到就说找不到：run 不存在回 404 与 E_NOT_FOUND，不回空壳。
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:

  /v1/runs/{id}/timeline:
    get:
      tags: [判定台账]
      summary: 一次判定的运行时间线
      description: |
        回答「哪一步慢、哪一步失败重试过几次、现在停在哪」。
        每步的起止、耗时、状态、尝试序号与退避时长都在里面，
        位置坐标按链上次序单调推进，两步不会重叠。

        时间线不带产物正文：正文按分码在 run 详情端点取，两处各回一半。
      operationId: getRunTimeline
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
